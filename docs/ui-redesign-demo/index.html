<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChangoFilm · 三列布局 UI Demo</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2300c880'/%3E%3Cpath d='M9 7.5v9l8-4.5z' fill='%2304121a'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 6.5v11l9.5-5.5z"/></svg>
      </span>
      <span class="brand-name">ChangoFilm</span>
      <span class="brand-ver">v1.11.1 · UI Demo</span>
    </div>
    <span class="run-badge" id="runBadge" role="status"></span>
    <div class="topbar-spacer"></div>
    <!-- Current project switcher: click to load recent projects (20 per batch) or create a blank one -->
    <div class="project-switcher" id="projectSwitcher">
      <button class="project-chip" id="projectChip" data-action="projectMenu" aria-haspopup="true" aria-expanded="false"></button>
      <button class="btn btn-sm project-save" id="projectSave" data-action="projectSave" hidden></button>
      <div class="project-menu" id="projectMenu" hidden></div>
    </div>
    <div class="topbar-spacer"></div>
    <button class="icon-btn mobile-only" id="genToggleMobile" data-action="genToggleMobile" aria-label="生成日志"></button>
    <!-- Simple / Pro dual-track mode switch (persisted) -->
    <button class="mode-toggle" id="modeToggle" data-action="modeToggle" aria-pressed="false"></button>
    <select class="lang-select" id="langSelect" aria-label="Language / 语言">
      <option value="zh">简体中文</option>
      <option value="en">English</option>
    </select>
    <button class="icon-btn" id="themeToggle" data-action="themeToggle" aria-label="切换主题"></button>
    <button class="icon-btn" id="settingsShortcut" data-action="nav" data-page="settings" aria-label="设置"></button>
  </header>

  <!-- ===== Three-column body ===== -->
  <div class="body" id="body">
    <!-- Left menu -->
    <nav class="nav" id="nav" aria-label="主菜单">
      <div class="nav-scroll" id="navScroll"></div>
      <div class="nav-foot">
        <button class="collapse-btn" id="navCollapse" data-action="navCollapse" aria-expanded="true">
          <span id="navCollapseIcon"></span>
          <span class="collapse-label" id="navCollapseLabel"></span>
        </button>
      </div>
    </nav>

    <!-- Center feature page + persistent action bar -->
    <main class="center">
      <div class="page-scroll" id="pageScroll">
        <div class="page" id="pageRoot"></div>
      </div>
      <div class="action-bar" id="actionBar"></div>
    </main>

    <!-- Right generation panel -->
    <aside class="gen" id="gen" aria-label="生成日志">
      <div class="gen-head">
        <span class="gen-title" id="genTitle"></span>
        <button class="icon-btn" id="failToggle" data-action="failToggle" aria-pressed="false"></button>
        <button class="icon-btn" id="genCollapse" data-action="genCollapse" aria-expanded="true"></button>
      </div>
      <div class="gen-body">
        <div class="gen-status" id="genStatus"></div>
        <div class="log-well" id="logWell">
          <div id="logLines"></div>
          <button class="jump-latest" id="jumpLatest" data-action="jumpLatest"></button>
        </div>
        <div class="gen-result" id="genResult"></div>
      </div>
      <div class="gen-rail">
        <button class="icon-btn" id="railExpand" data-action="genCollapse" aria-label="展开生成日志"></button>
        <span class="rail-dot" id="railDot"></span>
        <span class="rail-badge" id="railBadge" hidden></span>
        <span class="rail-label" id="railLabel"></span>
      </div>
    </aside>
  </div>

  <!-- Mobile bottom tab bar -->
  <nav class="tabbar" id="tabbar" aria-label="快捷导航"></nav>
</div>

<!-- Overlays -->
<div class="scrim" id="scrim" data-action="scrimClose"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer-head">
    <span class="drawer-title" id="drawerTitle"></span>
    <button class="icon-btn" data-action="drawerClose" id="drawerCloseBtn" aria-label="关闭"></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- Unsaved-changes confirmation modal -->
<div class="modal-scrim" id="modalScrim" data-action="modalCancel"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-title" id="modalTitle"></div>
  <div class="modal-body" id="modalBody"></div>
  <div class="modal-actions" id="modalActions"></div>
</div>

<input type="file" id="presetImportFile" accept="application/json,.json" hidden>
<input type="file" id="presetLibImportFile" accept="application/json,.json" hidden>
<input type="file" id="keyImportFile" accept="application/json,.json" hidden>
<input type="file" id="planImportFile" accept="application/json,.json" hidden>

<script src="app.js"></script>
</body>
</html>
